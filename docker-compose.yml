services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: algoviz
      POSTGRES_PASSWORD: algoviz
      POSTGRES_DB: algoviz
    ports:
      - "5432:5432"
    volumes:
      - algoviz_pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://algoviz:algoviz@db:5432/algoviz
      JWT_SECRET_KEY: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"

  frontend:
    build: ./client
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"

volumes:
  algoviz_pgdata:
